<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#082d31" />\n  <link rel="icon" href="data:," />
  <title>Water Garden — Interactive Pond</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="stage" aria-label="マウスや指で水面をかき混ぜられるインタラクティブな池">
    <canvas id="water" aria-hidden="true"></canvas>
    <canvas id="leaves" aria-hidden="true"></canvas>
    <div class="surface-light" aria-hidden="true"></div>

    <header class="brand">
      <strong>WATER GARDEN</strong>
      <span>INTERACTIVE POND</span>
    </header>

    <div class="hint" id="hint">
      <i></i>
      <span>水面をドラッグして流れをつくる</span>
    </div>

    <div class="unsupported" id="unsupported" hidden>
      <strong>WebGL 2 が必要です</strong>
      <span>Safari / Chrome / Edge の新しいバージョンで開いてください。</span>
    </div>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
